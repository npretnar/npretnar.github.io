---
layout: default
title: Media
permalink: /media/
---
<header class="page-head">
  <h1>Media</h1>
</header>

<section class="list-section">
  <h2>Media Appearances</h2>
  <ul class="entries">
    {%- for m in site.data.media %}
    <li>
      <span class="e-title">{% if m.url %}<a href="{{ m.url }}">{{ m.outlet }}</a>{% else %}{{ m.outlet }}{% endif %}</span>
      <span class="e-terms">{{ m.date }}</span>
    </li>
    {%- endfor %}
  </ul>
</section>
