# Research page content.
#
# Sections appear in the order listed; papers appear in the order listed
# within each section. To move a paper (e.g. R&R -> accepted), cut its block
# and paste it into the other section.
#
# Paper fields (all optional except title):
#   title       Paper title (no trailing period)
#   year        Year shown in the collapsed row
#   month       Shown before the year, e.g. "October"
#   coauthors   List of coauthors, in order. Leave out for solo work.
#   status      e.g. "Revise and Resubmit", "Under Review", "Presenting"
#   journal     Publishing journal, or target journal for R&Rs / submissions
#   volume, issue
#   url         Published (journal) version; shown as a "Paper" button
#   working_paper  Working-paper PDF; shown as a "Working Paper" button.
#               Unpublished papers use only this. On acceptance, keep it and
#               add url: for the journal version.
#   abstract    Markdown. Use ">-" and indent the text below it.
#   talks       Presentations, keyed by year (newest first)
#   press, notes  Markdown
#   links       List of {label, url} for appendices, replication files, slides
#
# Everything except title, coauthors, status/journal and year is hidden in the
# drop-down until the visitor expands the paper.

