      - title: Assessing Competitive Structure with Disaggregated Sectoral Definitions
        coauthors: [Marius Gruenewald]
        status: Data Work Ongoing
        year: 2025
        abstract: >-
          Market definitions are integral in applications involving
          competitive assessments. Yet, when markets are granular many large,
          multi-product firms operate in many small markets. Further, the more
          granular the market definition, often the less competitive markets
          become on average, since successful firms specialize in successful
          products (e.g., Coca Cola in the market for soda or Clorox in the
          market for cleaning products). How does the granularity of market
          definitions impact inferences regarding the competitive structure of
          an economy overall? Further, when should product categories be
          aggregated or dis-aggregated? That is, what do we lose/gain when
          engaging in aggregation and studying more aggregated markets? The
          notion of firms' pricing power depends on how demand is defined.
          Constructing product-type demand aggregates and assessing
          firm-specific market power for such aggregates changes the assessment
          of market power compared to when looking at granular, brand-level
          data. We study these questions using scanner data from European
          supermarkets, while assessing competition at different levels of
          product-type and sector classifications.

      - title: Rural Brain Drain Amidst Structural Change
        status: Model Written; Computational Work Ongoing; Seeking Coauthor(s)
        year: 2024
        abstract: >-
          As the services share of aggregate output in the U.S. has risen, so
          have high human-capital workers migrated away from rural areas and to
          cities. Migration patterns are observed despite the fact that the
          services share of aggregate output in rural areas is similar (and
          sometimes higher) than the share in urban areas. This is because the
          mix of service industries which dominate rural economies in the U.S.
          is generally less productive and requires lower human capital than
          urban services. Technical change and the human-capital input mix is
          thus different for rural services versus urban services. I explore
          how these twin facts about production have contributed to rural brain
          drain and rural/urban inequality in a multi-sector, multi-region
          model, where sectors differ by productivities and input/output
          elasticities and use durable capital and two types of labor (high
          and low human capital) as inputs. I further endogenize the household
          decision to acquire education and/or engage in costly migration. The
          model permits exploration of several questions. First, how have
          unbalanced technical change across sectors and regions contributed
          to the geo-spatial distribution of human capital? Second, since
          migration is costly, the geo-spatial distribution of human capital
          may be inefficient: what happens to aggregate output (and welfare) if
          moving costs are subsidized or removed? Third, how much is structural
          change driven by consumers choosing to take up increasing education?

      - title: New Products, Income Effects, and Growth
        coauthors: [W.L. Bednar]
        status: Model Written; Computational Work Ongoing; Seeking Additional Coauthor(s)
        year: 2023
        abstract: >-
          In this paper we explore a Melitz (2003) style model where consumers
          have preferences over an infinite menu of consumption products, but
          firms may not have the ability to produce a certain subset of these
          products profitably because of either high fixed entry costs or high
          marginal costs. As consumers get richer, they become more particular
          about the types of products they consume, so that as income increases
          new markets for new products emerge, leading to growth in output
          which feeds back into generating further income increases. However,
          while richer consumers may have more refined tastes which demand a
          more diverse set of consumption options, in order for a market for
          these new products to exist, the producing firms must be profitable.
          Thus, along the growth path, consumers may desire a positive amount
          of certain product types, yet they may not desire enough for the
          corresponding production sector to be profitable. This is because
          firms looking to enter the market face fixed costs associated with
          starting up production. Fixed costs may vary over time as total
          productivity increases, so that certain epochs are associated with
          higher rates of new firm entry than others, which can help drive
          so-called "growth miracles."

  - title: Dormant Projects
    id: dormant
    papers:
      - title: The Intergenerational Welfare Implications of Disease Contagion
        year: 2020
        abstract: >-
          Using endogenous, age-dependent measures of the value of statistical
          lives (VSL), this paper examines the demographic implications of
          recessions driven by disease contagions. Depending on the
          age-distribution mortality profile of the disease, long-run welfare
          losses resulting from the recession may outweigh lost VSL's directly
          attributable to the disease. This is because disease contagions that
          induce high levels of hospitalization simultaneously impact aggregate
          output, via a recession caused by social-distancing, and the
          productivity of health care services. The efficiency of health
          investment falls driving down life expectancy (LE). VSL's fall both
          because LE's fall and the marginal value of health care investment
          falls. Using the Hall and Jones (2007) model of age-specific,
          endogenous health investment, it is shown that the COVID-19 crisis of
          2020 will lead to lost welfare for young agents that exceeds VSL's
          lost from the disease. If COVID-19 had the same age-mortality profile
          as the 1918 Spanish Flu, where more young agents died,
          contagion-mitigation policies that cause deep recessions would still
          be socially optimal since more of the high-valued lives of young
          people would be saved.
        talks:
          2020: Macro-Dev-Trade-Environment Group Meeting, Virtual, Iowa State

      - title: Durables, Non-Durables, and a Structural Test of Fungibility
        coauthors: [Alan Montgomery, Christopher Y. Olivola]
        year: 2018
        working_paper: /papers/durables-non-durables-fungibility.pdf
        abstract: >-
          In his 1999 summary of all things mental accounting, Richard Thaler
          describes one of the primary components of mental accounting as the
          budgeting of specific utility-providing activities which can depend,
          but does not have to, on the resources used to fund those activities.
          The analysis presented in this paper focusses specifically on
          household expenditure of durable and non-durable goods and the
          liquidity sources used to fund these different expenditures.
          Specifically, we exploit a linked dataset of credit and debit card
          users to examine consumer purchasing patterns of durable and
          non-durable consumption commodities under both methods of payment.
          Our findings suggest that on average durable purchases are more
          sensitive to increases in available credit than non-durable
          purchases, and most consumers are more likely to increase total
          consumption due to increases in available credit than increases in
          available checking account balances. We empirically show that the
          standard neo-classical consumption/savings model, the equilibrium
          conditions of which implicitly assume that the household's available
          resources (liquidity and investments) are perfectly fungible, fails
          to rationalize our data for the median/modal consumer in our sample.
          However, our results are rich because we also show that the
          behavioral distribution of consumers includes both households which
          treat liquidity as fungible and those that do not. Given the
          heterogeneity we find, future work should test whether these results
          would matter on aggregate.
        talks:
          2019: ACR, Atlanta; Finance Forum, Madrid
          2018: Boulder Consumer Finance Conference; BDRM, Harvard; SJDM, New Orleans
