      - title: Measuring Inequality with Consumption Time
        year: 2025
        abstract: >-
          I construct and estimate a model of joint market consumption and
          off-market time use decisions that allows for heterogeneous
          complementarities between off-market time and market purchases
          jointly used in different off-market activities. The model yields
          both cost-of-living and welfare summary statistics which quantify
          household dispersion. When accounting for rich preference
          heterogeneity across consumption activities, dispersion in
          welfare-based compensating variation is significantly less than wage
          or expenditure dispersion, but under this measure society is
          becoming increasingly unequal at almost double the rate implied by
          wages and spending. Policy implications for the progressivity of
          labor-income taxes at reducing inequality are addressed.
        talks:
          2026: University of the Thai Chamber of Commerce
          2025: Indiana University (Economics); UNC, Charlotte
          2024: >-
