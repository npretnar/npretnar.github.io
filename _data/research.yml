      - title: Retirement Financing and Social Security Solvency in General Equilibrium
        coauthors: [Santiago Lisa]
        status: Data Work and Model Computation Ongoing
        year: 2026
        abstract: >-
          We develop an overlapping generations model with two productive
          sectors, a financial intermediary, and a detailed tax system that
          distinguishes between realized and unrealized capital gains through
          cost-basis tracking. This preliminary draft calibrates to the 1975
          U.S. economy, before modern retirement tax incentives, to study how
          mandatory retirement contributions and wealth taxation reshape
          life-cycle savings, labor supply, and Social Security financing.
          Given the size of the state space, our model solution and
          computational procedures require modifying the Deep Equilibrium Nets
          routine of Azinovic, Gaegauf, and Scheidegger (2022) to introduce
          reinforcement learning to optimize the neural network learning rate.
          In preliminary simulations we find that introducing 5 percent
          retirement contributions crowds out taxable savings by 25 percent
          while modestly raising labor supply. A 10 percent wealth tax on
          deposits triples savings and increases hours by 27 percent as
          households work to rebuild eroded wealth, sharply contrasting the
          behavioral response to realization-based capital gains taxes.
        notes: >-
          A preliminary draft can be requested by clicking
          [here](https://drive.google.com/file/d/1hdIwFBHEnThaf0tUqdoZOg_Drv1_87IF/view?usp=share_link).

      - title: College Football Labor Markets and the Production of Wins
        year: 2025

      - title: One Production Function
        coauthors: [Ákos Valentinyi]
        year: 2025
        abstract: >-
          In several quantitative exercises we estimate the stylized
          production technology of Pretnar and Valentinyi (2025) for countries
          at various stages of economic development. The fully estimated
          technology yields a country-specific developmental diagnostic
          assessment, which can be used to compare the underlying mechanisms
          driving different countries' macroeconomic growth and glean
          understanding as to what kinds of country-specific policies could
          improve growth prospects. Because our technology is more flexible
          and of a richer structure than a traditional CES production function,
          it yields more detailed inferences regarding the country-specific
          macroeconomic transformations associated with aggregate growth.
          Further, even when macroeconomic data is sparse or poorly measured,
          we show how Bayesian inference can be used to estimate the aggregate
          technology in order that inferences can be drawn from its
          quantitative features. We show that, given assumptions regarding
          elasticity heterogeneity across countries, otherwise unmeasured
          values of country-specific capital stocks can be inferred from data
          through our model's lens.
        talks:
          2025: Midwest Macro, FRB, Cleveland

