  - title: New Work (incl. R&R's)
    id: new-work
    papers:
      - title: Sexual Hegemons and Involuntary Celibates
        status: Presenting
        year: 2026
        abstract: >-
          Heterosexual couple formation has fallen in the United States even as dating apps have seemingly made search cheaper. I study a two-sided directed-search model of dating in which agents differ in productivity and desirability. Men sort on similarity; women's preferences are monotone in male quality, so all women share one ranking of men. With balanced type mixes and numbers, free contact, and visible types, matching is assortative and, if mismatches are costly enough, male inequality is only a result of differences in their own primitive attributes. Unequal type mixes make surplus types match less often; when women are over-represented at the top and men at the bottom, the longest waits fall on the less advantaged men. Costly contact makes match rates diverge, as women contact desirable men more readily, and break-ups, by returning men to the market, turn divergent rates into sexual hegemons --- men who match again and again --- while longer-lasting matches even out men's shares of matches. When attributes are hidden, men of different types end up pooled in the same queue, whose composition women know but whose members they cannot tell apart without screening, so rejecting a man buys a chance of someone better. Since women share one monotone ranking of men by both productivity and desirability, a man pooled with better men can fall below women's shared cutoff and is then rejected once his type is revealed: this is involuntary celibacy. Were types visible ex-ante, rejecting him would only mean waiting for another man just like him, so no one would be excluded: involuntary celibacy, in which a man matches only occasionally and only by mistake, is an information problem. Cheaper contact raises every man's match rate where types are visible. Where types are hidden, its direct effect, holding fixed who is still searching, is to give women more options and raise their cutoffs above marginal men, though the pool's response can push back. Women who judge who is available by the men they encounter, a sample skewed by ranked feeds and their own choices, set standards too high, and nothing they see corrects them. Publishing the exact composition of the men still searching would, holding that pool fixed, lower those standards, but a platform that earns more the longer users keep searching, as many dating apps plausibly do, prefers hidden types, no disclosure, and a skewed feed. A planner minimizing the dispersion of male welfare would compensate rather than sort wherever that lowers the dispersion, favoring the men the market leaves worst off; there, the market's allocation is the reverse of the optimum.
          
      - title: Elder Care in General Equilibrium
        coauthors: [Finn Kydland, Tonya Kydland]
        status: Presenting
        year: 2026
        abstract: >-
          Elder-care demand depends on aging and dependency shocks; over
          1990--2020, falling dependency nearly offset U.S. aging. With formal
          markets and informal transfers supplying care, demand changes affect
          each channel differently. We estimate aggregate substitution
          elasticities in a two-sector general-equilibrium overlapping-generations
          model: formal and informal care are weak complements, care and other
          consumption strong ones, so formal care's spending share rises with
          its price. Negative nursing TFP growth, not demography, raised formal
          care's relative price, drew inputs into nursing, and shifted care
          toward informal caregivers. Concerns that aging slows growth are
          misplaced if either strong-sector technology grows robustly or
          natality improves.
        talks:
          2026: >-
            Concordia University; Hitotsubashi University; The University of Hong Kong (HKU); Peking
            University HSBC Business School, Shenzhen
          2019: SNDE, Dallas Fed; XXIV Workshop on Dynamic Macro, Vigo Spain
          2018: UCSB; University of Missouri; Midwest Macro, Madison, WI; SED, Mexico City
        press: >-
          [Benefits Pro](https://www.benefitspro.com/2019/02/11/aging-population-is-an-economic-double-whammy-412-77713/?slreturn=20200528211934);
          [Who Will Care for All the Old People?](https://voxeu.org/content/live-long-and-prosper-economics-ageing-populations)
          VoxEU in: *Live Long and Prosper? The Economics of Ageing
          Populations* (2019); NPR's The Confluence, 90.5 WESA, Pittsburgh
          (June 30, 2023).
        notes: >-
          Previous version is [NBER Working Paper
          \#25498](/papers/costs-and-benefits-of-caring-nber-w25498.pdf),
          entitled *The Costs and Benefits of Caring: Aggregate Burdens of an
          Aging Population*.

      - title: Unbalanced Growth Across Sectors and Space
        coauthors: [Kausthub Satluri]
        status: Presenting
        year: 2026
        abstract: >-
          Following a version of the sectoral definitions in Fang and
          Herrendorf (2021), we examine how United States economic activity by
          broad sector varies across two different partitions of the spatial
          environment. We look at the composition of aggregate income by sector
          for spatial partitions that distinguish between places based on both
          commuting zones and population density. Our findings inspire a simple
          yet insightful growth accounting exercise from which a decomposition
          of aggregate output growth and output per-capita growth can be made
          as a function of place/sector pairs. Despite income per capita
          growing fastest in rural areas since 2000, the rural population has
          not grown fast enough to keep up with more urbanized areas, reducing
          rural areas' share of aggregate output. Rural growth has been mostly
          driven by low-skilled industries, like manufacturing and low-skilled
          services, despite high-skilled services income growing fastest
          amongst all rural sectors; however, high-skilled services comprise
          such a small fraction of rural economic activity that even fast
          growth rates do not lead to significant catch up rates for rural
          areas relative to urban ones. High-skilled services are the fastest
          growing sector in the economy, contributing to 53% of growth in urban
          income from 2003-2023 but only 27% of growth in rural income.
        talks:
          2026: >-
            University of Montreal; CIRJE, University of Tokyo; LAEF/UConn Growth, Inequality, and Macro
            Development Conference, Storrs, CT; University of Mohammed VI
            Polytechnic (Virtual); XI Workshop on Structural Transformation and
            Macroeconomic Dynamics, Frankfurt am Main, Germany
        links:
          - label: Slides
            url: /papers/unbalanced-growth-across-sectors-and-space-slides.pdf

      - title: A Theory of Long-run Development with Capital
        coauthors: [Ákos Valentinyi]
        status: Under Review
        journal: Journal of Political Economy Macroeconomics
        year: 2026
        working_paper: /papers/long-run-development-with-capital.pdf
        abstract: >-
          This paper offers a unified framework for understanding long-run
          growth across the pre-industrial, transitional, and industrial eras.
          We build a flexible growth model with three factors of production
          (land, capital, and labor) and two distinct productivities which
          separately augment land/labor and capital/labor complementarities.
          The structure generates endogenously variable elasticities of
          substitution and explains shifts in both factor income shares and
          aggregate output over an entire time series. Estimated on historical
          data from England and Wales, the model reconciles multiple growth
          regimes and provides new insights into the forces that led to
          industrialization.
        talks:
          2026: SED, Athens
          2025: >-
            Finn's Skål, IE Tower, Madrid; National University of Singapore;
            University of Pretoria, South Africa; EUI, Florence, Italy; FRB,
            St. Louis
          2024: >-
            SED, Buenos Aires; EWMES, Palma de Mallorca, Spain; Vanderbilt
            University; University of Barcelona; MEA Meetings, Chicago
        notes: >-
          Previous versions of this project were presented under the titles
          *Coffee, Tea, and the Industrial Revolution*; *Stimulating Industrial
          Revolution*; *A Capitalist Theory of Economic Development*; and *One
          Production Function*.

      - title: Mental Accounting Through Two-stage Budgeting Under Bounded Rationality
        coauthors: [Christopher Y. Olivola, Alan Montgomery]
        status: Under Review
        journal: Journal of Economic Behavior & Organization
        year: 2026
        working_paper: /papers/mental-accounting-two-stage-budgeting.pdf
        abstract: >-
          We propose a model that generalizes two-stage budgeting to
          incorporate frictions which induce budgetary stickiness and mental
          accounting behavior. Inattention limits the fungibility of money
          across mental accounts, leading to boundedly rational behavior.
          Financial attentiveness is cognitively costly, so consumers might
          re-assess only a subset of spending budgets every period. Over- or
          under-spending affects future budgeting and expenditure decisions. We
          discipline the model with agent-level weekly expenditure data from
          low-income consumers and explore its quantitative implications for
          the degree to which budgeting behavior reflects bounded rationality,
          as well as the potential consequences of interventions that encourage
          budgeting discipline. Attentiveness constraints can have a
          disciplinary effect on finances: under the model's assumptions,
          relaxing constraints leads some consumers to over-spend and become
          financially worse off.
        talks:
          2025: Indiana University (Kelley Finance)
          2022: FUR Conference, Ghent, Belgium
          2021: Columbia University, New York
          2020: >-
            INFER (Virtual); NBER-NSF SBIES (Virtual); UCSB, Theory
            Underground; ARC for Financial Planning, Washington D.C.
          2019: ACR, Atlanta
          2017: INFORMS Marketing Science, Los Angeles
        notes: >-
          Previous versions of this paper were circulated under the titles
          *Two-stage Budgeting with Bounded Rationality*, *A Structural Model
          of Mental Accounting*, and *Two-stage Budgeting Under Mental
          Accounting*.

      - title: Structural Change with Time to Consume
        coauthors: [W.L. Bednar]
        status: Revise and Resubmit
        journal: International Economic Review
        year: 2025
        working_paper: /papers/structural-change-with-time-to-consume.pdf
        abstract: >-
          We explore the relationship between household time-use and the
          long-run rise in the services share of expenditure. Using the
          American Time Use Survey, we study how households allocate their
          off-market time between using goods and using services. While
          relative goods to services market expenditure has declined along the
          development path, relative off-market time spent using goods versus
          services has risen. To understand which of rising incomes, declining
          relative prices, or changing preferences is the primary driver of
          simultaneous expenditure and time use trends, we estimate a model
          where consumers have non-separable preferences over market
          consumption and multiple different off-market activities. We find no
          role for income effects driving structural change in our preferred
          specifications. Structural change is almost entirely attributable to
          both falling relative goods/services prices and the rising relative
          off-market efficiency of using goods versus services.
        talks:
          2024: X Workshop on Structural Transformation and Macroeconomic Dynamics, Cagliari, Italy
          2023: FRB, Atlanta
          2022: >-
            FRB, Philadelphia; Midwest Macro, Dallas, TX; UCSB, LAEF Growth,
            Development, and Structural Transformation Conference; University of
            Pittsburgh; University of Wuerzburg, Germany
          2021: >-
            NBER-NAS SBIES (Virtual); Vigo Workshop on Dynamic Macro, Vigo
            Spain; SED, Minneapolis, MN; University of Miami, Florida (Virtual)
          2020: SNDE, Virtual; University of Miami, Florida (Virtual)
          2019: UCSB; Midwest Macro, East Lansing, MI; SED, Saint Louis, MO
          2018: UCSB
        links:
          - label: Technical appendices
            url: /papers/structural-change-with-time-to-consume-appendix.pdf

  - title: Working Papers
