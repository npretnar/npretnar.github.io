upcoming:
  - title: 5th Annual Junior Workshop in Macroeconomics
    dates: October 30–31, 2026
    location: Santa Barbara, CA, USA
    coorganizers: Job Boerma (University of Wisconsin, Madison), Paolo Martellini (NYU, Stern)
    program: >-
      Conference details can be found
      [here](https://laef.ucsb.edu/events/5th-annual-junior-workshop-macroeconomics).

  - title: 2nd LAEF-HKU Joint Conference on Growth and Inequality
    dates: December 4–5, 2026
    location: Hong Kong
    coorganizers: >-
      Xiaodong Zhu (HKU), Yueyuan Ma (UCSB), Xiaomei Sui (HKU), Lichen Zhang
      (HKU), Anson Zhou (HKU), Uta Schoenberg (HKU), Jinglun Yao (HKU), Simon
      Margolin (UCSB), Laura Murphy (UCSB)
    program: >-
      The submission deadline has passed; decision notifications have been
      issued as of September 30, 2026.

  - title: 6th Labor Markets and Macroeconomic Outcomes
    dates: April 16–17, 2027
    location: Santa Barbara, CA, USA
    coorganizers: >-
      Adam Blandin (Vanderbilt University), Kathleen McKiernan (Vanderbilt
      University), Yueyuan Ma (UCSB), Simon Margolin (UCSB), Laura Murphy (UCSB)
    program: >-
      The call for papers is available by [clicking
      here](https://editorialexpress.com/conference/6thLAEFLabor/), and is open
      until December 20, 2026.

  - title: 15th Advances in Macro-Finance, Tepper-LAEF Conference
    dates: April 23–24, 2027
    location: Pittsburgh, PA, USA
    coorganizers: >-
      Lars-Alexander Kuehn (CMU, Tepper), Finn Kydland (UCSB), Simon Mayer
      (CMU, Tepper), Liyan Shi (CMU, Tepper), Ariel Zetlin-Jones (CMU, Tepper),
      Shengxing Zhang (CMU, Tepper)
    program: The call for papers will open in winter of 2026/2027.

